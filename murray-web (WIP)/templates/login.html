<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murray - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'murray-primary': '#4f46e5',
                        'murray-purple': '#675582',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <!-- Logo -->
            <div class="text-center">
                <h1 class="text-4xl font-bold text-murray-primary">Murray</h1>
                <p class="mt-2 text-sm text-gray-600">Geo-Experimental Analysis Platform</p>
            </div>

            <!-- Login Form -->
            <div class="bg-white shadow-lg rounded-lg p-8">
                <div class="mb-6">
                    <div class="flex border-b">
                        <button id="login-tab" class="flex-1 py-2 text-center border-b-2 border-murray-primary text-murray-primary font-semibold">
                            Login
                        </button>
                        <button id="register-tab" class="flex-1 py-2 text-center text-gray-500 hover:text-gray-700">
                            Register
                        </button>
                    </div>
                </div>

                <!-- Login Form -->
                <div id="login-form-container">
                    <form id="login-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                            <input type="text" id="login-username" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-murray-primary">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                            <input type="password" id="login-password" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-murray-primary">
                        </div>
                        <button type="submit"
                                class="w-full bg-murray-primary text-white py-2 px-4 rounded-lg hover:bg-indigo-700 transition duration-200">
                            Login
                        </button>
                    </form>
                    <div id="login-error" class="mt-4 text-red-600 text-sm hidden"></div>
                </div>

                <!-- Register Form -->
                <div id="register-form-container" class="hidden">
                    <form id="register-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                            <input type="text" id="register-username" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-murray-primary">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                            <input type="password" id="register-password" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-murray-primary">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                            <input type="password" id="register-password-confirm" required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-murray-primary">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Registration Token or @entropy.tech Email</label>
                            <input type="text" id="register-token"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-murray-primary"
                                   placeholder="Optional for @entropy.tech">
                        </div>
                        <button type="submit"
                                class="w-full bg-murray-primary text-white py-2 px-4 rounded-lg hover:bg-indigo-700 transition duration-200">
                            Register
                        </button>
                    </form>
                    <div id="register-error" class="mt-4 text-red-600 text-sm hidden"></div>
                    <div id="register-success" class="mt-4 text-green-600 text-sm hidden"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Tab switching
        const loginTab = document.getElementById('login-tab');
        const registerTab = document.getElementById('register-tab');
        const loginFormContainer = document.getElementById('login-form-container');
        const registerFormContainer = document.getElementById('register-form-container');

        loginTab.addEventListener('click', () => {
            loginTab.classList.add('border-b-2', 'border-murray-primary', 'text-murray-primary', 'font-semibold');
            registerTab.classList.remove('border-b-2', 'border-murray-primary', 'text-murray-primary', 'font-semibold');
            loginFormContainer.classList.remove('hidden');
            registerFormContainer.classList.add('hidden');
        });

        registerTab.addEventListener('click', () => {
            registerTab.classList.add('border-b-2', 'border-murray-primary', 'text-murray-primary', 'font-semibold');
            loginTab.classList.remove('border-b-2', 'border-murray-primary', 'text-murray-primary', 'font-semibold');
            registerFormContainer.classList.remove('hidden');
            loginFormContainer.classList.add('hidden');
        });

        // Login form
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const errorDiv = document.getElementById('login-error');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('murray_token', data.token);
                    localStorage.setItem('murray_username', data.username);
                    window.location.href = '/design';
                } else {
                    errorDiv.textContent = data.error || 'Login failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.classList.remove('hidden');
            }
        });

        // Register form
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('register-username').value;
            const password = document.getElementById('register-password').value;
            const passwordConfirm = document.getElementById('register-password-confirm').value;
            const registrationToken = document.getElementById('register-token').value;
            const errorDiv = document.getElementById('register-error');
            const successDiv = document.getElementById('register-success');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            if (password !== passwordConfirm) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.classList.remove('hidden');
                return;
            }

            if (password.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters';
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password, registration_token: registrationToken})
                });

                const data = await response.json();

                if (data.success) {
                    successDiv.textContent = 'Registration successful! Please login.';
                    successDiv.classList.remove('hidden');
                    document.getElementById('register-form').reset();
                    setTimeout(() => loginTab.click(), 2000);
                } else {
                    errorDiv.textContent = data.error || 'Registration failed';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Connection error. Please try again.';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
